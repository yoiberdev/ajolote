# La política de contenido va solo en el HTML: todo sale del propio sitio, fuentes incluidas. No
# hace falta 'unsafe-inline': Svelte y Threlte cambian los estilos desde JavaScript, no con atributos.
map $sent_http_content_type $csp {
    default "";
    ~text/html "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'";
}

# El HTML se revalida siempre; los /assets/ llevan hash en el nombre y se guardan un año.
map $sent_http_content_type $cache_html {
    default "";
    ~text/html "public, max-age=0, must-revalidate";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    # add_header no se hereda: si un location declara uno propio, pierde todos estos.
    add_header Content-Security-Policy $csp always;
    add_header Cache-Control $cache_html always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
